name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swift:
    # The Electron implementation under src/ is deprecated; CI validates the
    # current Swift product under swift/. Integration tests skip automatically
    # without DBBBB_TEST_* URLs, so no database services are needed here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6.x toolchain)
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build
        working-directory: swift

      - name: Test
        run: swift test
        working-directory: swift
